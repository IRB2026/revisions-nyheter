name: Daily News Update
on:
  schedule:
    - cron: '0 5 * * *' # Körs varje morgon kl 05:00
  workflow_dispatch: # Gör att du kan starta den manuellt

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Uppdaterad från v3 till v4

      - name: Set up Python
        uses: actions/setup-python@v5 # Uppdaterad från v4 till v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install feedparser

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'NewsBot'
          git config --global user.email 'bot@example.com'
          git add news_history.json
          git commit -m "Uppdaterat nyheter" || exit 0
          git push
