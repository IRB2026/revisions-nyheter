<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisionsnyheter: BDO, GT & Cedra</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-10">
    <div class="max-w-4xl mx-auto">
        <header class="mb-10 text-center">
            <h1 class="text-4xl font-extrabold text-blue-900 mb-2">Revisionsbevakaren</h1>
            <p class="text-gray-600 italic">Bevakar BDO, Grant Thornton och Cedra i Sverige</p>
            <p class="text-xs text-gray-400 mt-2">Historik sedan 2025-01-01</p>
        </header>

        <div id="news-container" class="space-y-6">
            <p class="text-center text-gray-500">Söker efter senaste nytt...</p>
        </div>
    </div>

    <script>
        async function loadNews() {
            try {
                const response = await fetch('news_history.json');
                const news = await response.json();
                const container = document.getElementById('news-container');
                container.innerHTML = '';

                if (news.length === 0) {
                    container.innerHTML = '<p class="text-center">Inga nyheter hittades ännu för 2025.</p>';
                    return;
                }

                news.forEach(item => {
                    const card = document.createElement('div');
                    card.className = "bg-white p-6 rounded-xl shadow-md border-l-8 " + 
                        (item.firm === 'BDO' ? 'border-red-600' : 
                         item.firm === 'Grant Thornton' ? 'border-purple-800' : 'border-blue-500');
                    
                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-2">
                            <span class="px-2 py-1 rounded bg-gray-100 text-xs font-bold uppercase text-gray-600">${item.firm}</span>
                            <span class="text-sm text-gray-400">${new Date(item.date).toLocaleDateString('sv-SE')}</span>
                        </div>
                        <h2 class="text-xl font-bold text-gray-800 leading-tight">
                            <a href="${item.link}" target="_blank" class="hover:text-blue-600 transition-colors">${item.title}</a>
                        </h2>
                        <p class="mt-4 text-sm text-gray-500 font-medium">Källa: ${item.source}</p>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                document.getElementById('news-container').innerHTML = "Ingen historik tillgänglig än. Första körningen sker vid midnatt.";
            }
        }
        loadNews();
    </script>
</body>
</html>
